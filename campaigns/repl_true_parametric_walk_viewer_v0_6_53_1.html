<script>window.__boot={stage:'CLASSIC',since:Date.now(),done:false};const $=id=>document.getElementById(id);window.__stage=s=>{window.__boot.stage=s;window.__boot.since=Date.now();$('status').textContent='LOADING '+s};window.__fail=e=>{$('status').textContent='VIEWER_ERROR: '+String(e).slice(0,500);$('metrics').textContent='BOOT_STAGE='+window.__boot.stage+'; '+String(e).slice(0,200)};setInterval(()=>{if(!window.__boot.done&&Date.now()-window.__boot.since>30000)window.__fail('TIMEOUT '+window.__boot.stage)},5000);window.onerror=(m)=>window.__fail(m);window.onunhandledrejection=e=>window.__fail(e.reason);</script>

const spec=JSON.parse(new TextDecoder().decode(fb));if(spec.source_sha256!==receipt.source_sha256)throw Error('FIT_SOURCE_MISMATCH');
window.__stage('PARSE_GLB');const gltf=await new GLTFLoader().parseAsync(mb,'./');
window.__stage('RENDER');const canvas=$('scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xc9d9e4);const ctl=new FittedParametricWalk(gltf,spec);scene.add(ctl.model);
let skinnedCount=0;gltf.scene.traverse(o=>{if(o.isSkinnedMesh){o.frustumCulled=false;skinnedCount++}});const ref=clone(gltf.scene);ref.position.x+=2.3;ref.traverse(o=>{if(o.isSkinnedMesh)o.frustumCulled=false});scene.add(ref);ref.visible=false;const mix=new THREE.AnimationMixer(ref),clip=gltf.animations.find(x=>x.name===spec.source_clip),action=mix.clipAction(clip);action.play();
const grid=new THREE.GridHelper(120,120,0x8f9caa,0xb2c5d2);grid.position.y=-.035;scene.add(grid);scene.add(new THREE.HemisphereLight(0xffffff,0x697e8c,2.0));const light=new THREE.DirectionalLight(0xffffff,2.1);light.position.set(4,10,5);scene.add(light);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const camera=new THREE.PerspectiveCamera(39,1,.02,180);camera.position.set(3.75,1.25,2.0);const orbit=new OrbitControls(camera,canvas);orbit.target.set(0,.76,0);orbit.update();const resize=()=>{renderer.setSize(Math.max(2,canvas.clientWidth),Math.max(2,canvas.clientHeight),false);camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix()};resize();new ResizeObserver(resize).observe(canvas);

let lastRoot=worldRoot();

 if(![root.x,root.y,root.z].every(Number.isFinite)){
   $('status').textContent='RENDER_GUARD: non-finite root position';return false;
 }
 // Follow *all* finite root translations, including immediate stride/cadence

 const delta=root.clone().sub(lastRoot);

};
