<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Obsidianti · Sparse FK Review</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#f2f4ff;font:14px system-ui;min-height:100dvh;display:flex;flex-direction:column}header,footer{padding:12px;background:#182537}h1{font-size:19px;margin:0 0 5px}#identity,#status{font-size:12px;color:#c4d4e6;overflow-wrap:anywhere}main{flex:1;min-height:52vh;position:relative}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{background:#344a67;color:#fff;border:1px solid #91a6c4;border-radius:7px;padding:9px;min-height:42px;font:inherit}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffc75c}#scrub{width:100%;min-height:38px}.note{font-size:12px;color:#d5e0eb}.error{color:#ffac9e!important}#clock{font-variant-numeric:tabular-nums}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body><header><h1>Obsidianti · Sparse FK Review v1.10.5</h1><div id="status" role="status" aria-live="polite">Verifying export…</div><div id="identity">Pending build verification</div></header>
<main><canvas id="stage" aria-label="3D Obsidianti animated character viewer"></canvas></main>
<footer><div class="controls"><label for="clip">Animation</label><select id="clip"></select><button id="play">Pause</button><button id="restart">Restart</button><button id="prev">−½ frame</button><button id="next">+½ frame</button><output id="clock">0.00s</output></div><input type="range" id="scrub" min="0" max="1" step="0.0001" value="0" aria-label="Scrub animation"/><div class="controls"><label for="rate">Speed</label><select id="rate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><label><input type="checkbox" id="loop" checked/> Loop</label><span class="note">One real sparse-FK export · orbit / pinch to inspect · original FK unchanged · unapproved visual review</span></div></footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const el=x=>document.getElementById(x), status=el('status');
(async()=>{try{
const run=new URLSearchParams(location.search).get('run');if(!run)throw Error('Missing URL run identity');
const m=await fetch('manifest.json?run='+encodeURIComponent(run),{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('Manifest HTTP '+r.status);return r.json()});
if(m.run!==run)throw Error('Wrong run identity');
const resp=await fetch(m.asset+'?sha='+m.glbSHA256,{cache:'no-store'});if(!resp.ok)throw Error('GLB HTTP '+resp.status);
const bytes=await resp.arrayBuffer();const hex=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('');
if(hex!==m.glbSHA256)throw Error('GLB identity mismatch '+hex);
el('identity').textContent='RUN '+run+' | GIT '+m.gitCommit+' | BLEND '+m.blendSHA256+' | GLB '+m.glbSHA256+' | LAUNCHER '+m.launcherSHA256;
const gltf=await new Promise((ok,no)=>new GLTFLoader().parse(bytes,location.href,ok,no));
const names=gltf.animations.map(a=>a.name);const missing=m.clips.filter(s=>!names.some(n=>n===s||n.includes(s)));if(missing.length)throw Error('Missing animation(s): '+missing.join(', '));
if(!gltf.scene)throw Error('No rendered mesh');let meshCount=0;gltf.scene.traverse(x=>{if(x.isMesh)meshCount++});if(!meshCount)throw Error('No meshes in export');
const renderer=new THREE.WebGLRenderer({canvas:el('stage'),antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#162333');const camera=new THREE.PerspectiveCamera(43,1,0.01,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x677891,2.2));const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(2,5,3);scene.add(light);scene.add(new THREE.GridHelper(8,16,0x58718b,0x384c61));scene.add(gltf.scene);
const bounds=new THREE.Box3().setFromObject(gltf.scene),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const span=Math.max(size.x,size.y,size.z,0.1);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(span*1.4,span*0.9,span*1.8));camera.near=Math.max(.001,span/1000);camera.far=Math.max(100,span*100);camera.updateProjectionMatrix();controls.update();
let mixer=new THREE.AnimationMixer(gltf.scene),clip=null,playing=true,t=0,last=performance.now();const clips=gltf.animations;for(const a of clips){const opt=document.createElement('option');opt.value=a.name;opt.textContent=a.name;el('clip').append(opt)}
let defaultClip=clips.find(a=>a.name.includes('Heavy1'))||clips[0];el('clip').value=defaultClip.name;
function select(){mixer.stopAllAction();clip=clips.find(a=>a.name===el('clip').value);if(!clip||clip.duration<=0)throw Error('Invalid selected animation');mixer.clipAction(clip).reset().play();t=0;update();status.textContent='VERIFIED sparse FK export · '+clip.name+' · '+meshCount+' mesh(es) · UNAPPROVED'}
function update(){mixer.setTime(t);el('scrub').value=String(t/clip.duration);el('clock').textContent=t.toFixed(3)+'s / '+clip.duration.toFixed(3)+'s'}
el('clip').onchange=select;el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'Pause':'Play'};el('restart').onclick=()=>{t=0;update()};el('prev').onclick=()=>{playing=false;el('play').textContent='Play';t=Math.max(0,t-1/60);update()};el('next').onclick=()=>{playing=false;el('play').textContent='Play';t=Math.min(clip.duration,t+1/60);update()};el('scrub').oninput=()=>{playing=false;el('play').textContent='Play';t=Number(el('scrub').value)*clip.duration;update()};
select();function draw(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(playing){t+=dt*Number(el('rate').value);if(t>=clip.duration){if(el('loop').checked)t%=clip.duration;else{t=clip.duration;playing=false;el('play').textContent='Play'}}update()}const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;if(w>0&&h>0){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera);requestAnimationFrame(draw)}requestAnimationFrame(draw);
}catch(e){console.error(e);status.classList.add('error');status.textContent='VIEWER BLOCKED: '+String(e)}})();
</script></body></html>
