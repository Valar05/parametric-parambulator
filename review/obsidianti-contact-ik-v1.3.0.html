<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidianti • v1.3.0 native-foot-contact IK review</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#151922;color:#f3f5fb;font:15px system-ui;display:flex;flex-direction:column;height:100dvh}header{background:#202936;padding:9px 14px}header strong{display:block}#status{font-size:12px;color:#bac8dd}main{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}footer{padding:10px;background:#202936;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;color:#f7faff;background:#34445a;border:1px solid #7488a8;border-radius:8px;padding:7px}label{font-size:13px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fbd66d}.tip{font-size:12px;color:#c0cbd9}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body>
<header><strong>Obsidianti • source-contact IK (v1.3.0 candidate)</strong><span id="status" role="status" aria-live="polite">Loading canonical GLB and clips…</span></header>
<main id="stage"></main>
<footer><label for="clips">Animation</label><select id="clips" aria-label="Choose animation"></select><button id="play">Pause</button><button id="again">Replay</button><label for="speed">Speed</label><select id="speed"><option value=".5">½×</option><option value="1" selected>1×</option><option value="1.5">1½×</option><option value="2">2×</option></select><label for="ground">Floor visual offset (m)</label><input id="ground" type="range" min="-0.05" max="0.05" step="0.001" value="0" aria-label="Ground reference offset"/><span id="groundtext" class="tip">0.000</span><span class="tip">Orbit: drag • Zoom: pinch • Pelvis pitch restored • Source-grounded feet • Owner visual review required</span></footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const holder=document.getElementById('stage'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x151922);
const camera=new THREE.PerspectiveCamera(37,1,.02,200);camera.position.set(2.5,1.8,4.1);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;holder.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0.95,0);controls.minDistance=.4;controls.maxDistance=25;
scene.add(new THREE.HemisphereLight(0xffffff,0x62748a,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(3,5,4);scene.add(sun);
const grid=new THREE.GridHelper(7,24,0x536076,0x384254);scene.add(grid);
let actor=null,mixer=null,actions=new Map(),selected=null,paused=false,clock=new THREE.Clock();const choice=document.getElementById('clips');
new ResizeObserver(()=>{const w=Math.max(1,holder.clientWidth),h=Math.max(1,holder.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(holder);
function choose(name){if(!mixer)return;for(const a of actions.values())a.stop();mixer.stopAllAction();selected=actions.get(name)||null;paused=false;if(selected){selected.reset();selected.enabled=true;selected.setLoop(THREE.LoopRepeat,Infinity);selected.play()}document.getElementById('play').textContent='Pause';status.textContent=`Playing ${name}; ${actions.size} clips in one canonical GLB. User visual acceptance pending.`}
new GLTFLoader().load('../assets/obsidianti/Obsidianti.glb?review='+Date.now(),result=>{
 actor=result.scene;actor.traverse(n=>{if(n.name==='TabardHang'||n.name==='geometry_0.001')n.visible=false});scene.add(actor);mixer=new THREE.AnimationMixer(actor);
 const box=new THREE.Box3().setFromObject(actor),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());controls.target.set(center.x,center.y,center.z);camera.position.set(center.x+size.y*1.65,center.y+size.y*.72,center.z+size.y*2.12);camera.lookAt(controls.target);controls.update();
 for(const clip of result.animations){const act=mixer.clipAction(clip);actions.set(clip.name,act);const option=document.createElement('option');option.value=clip.name;option.textContent=`${clip.name} · ${clip.duration.toFixed(2)}s`;choice.add(option)}
 const preferred=actions.has('ObsidiantiIdle')?'ObsidiantiIdle':actions.has('LionheartIdle_UNREVIEWED')?'LionheartIdle_UNREVIEWED':result.animations[0]?.name;
 if(preferred){choice.value=preferred;choose(preferred)}else status.textContent='BLOCKED: no clips on canonical GLB';
},undefined,e=>status.textContent='BLOCKED: canonical asset did not load: '+String(e));
choice.addEventListener('change',()=>choose(choice.value));document.getElementById('play').onclick=()=>{paused=!paused;document.getElementById('play').textContent=paused?'Play':'Pause'};document.getElementById('again').onclick=()=>choose(choice.value);
document.getElementById('ground').addEventListener('input',e=>{const y=Number(e.target.value);grid.position.y=y;document.getElementById('groundtext').textContent=y.toFixed(3)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(.06,clock.getDelta());if(mixer&&!paused)mixer.update(dt*Number(document.getElementById('speed').value));controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
