<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidianti Idle • animation review</title>
<style>body{margin:0;background:#141820;color:#e9edf5;font:15px system-ui;display:flex;flex-direction:column;height:100dvh}header{padding:.7rem 1rem;background:#252b38}main{min-height:0;flex:1;position:relative}canvas{display:block;width:100%;height:100%}footer{background:#252b38;padding:.65rem;display:flex;gap:.45rem;flex-wrap:wrap}button{background:#374358;color:white;border:1px solid #7288aa;border-radius:7px;padding:.55rem .75rem;font-size:14px}button:focus-visible{outline:2px solid yellow}.sub{font-size:12px;color:#bec7d7}#status{white-space:normal}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script>
</head><body><header><strong>Obsidianti • original clips + Lionheart Idle candidate</strong><div id="status" class="sub" role="status">Loading exact canonical GLB…</div></header><main id="scene"></main><footer><button id="idle">Idle candidate</button><button id="walk">Walking</button><button id="run">Running</button><button id="rest">Bind</button><button id="pause">Pause / Play</button><span class="sub">Drag: orbit • wheel/pinch: zoom • Idle visual approval ≠ animation acceptance</span></footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.querySelector('#scene'), status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x141820);const camera=new THREE.PerspectiveCamera(37,1,.01,100);camera.position.set(2.8,1.7,4.7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.88,0);controls.minDistance=.4;controls.maxDistance=15;const light=new THREE.HemisphereLight(0xffffff,0x667788,2.0);scene.add(light);const dir=new THREE.DirectionalLight(0xffffff,2.2);dir.position.set(2,5,4);scene.add(dir);const grid=new THREE.GridHelper(8,20,0x566171,0x364154);scene.add(grid);
let mixer=null,actions={},current=null,playing=true;const clock=new THREE.Clock();
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();
new GLTFLoader().load('../assets/obsidianti/Obsidianti.glb',g=>{
 const actor=g.scene;scene.add(actor);mixer=new THREE.AnimationMixer(actor);for(const a of g.animations)actions[a.name]=mixer.clipAction(a);
 const target=new THREE.Box3().setFromObject(actor);const size=target.getSize(new THREE.Vector3());const center=target.getCenter(new THREE.Vector3());controls.target.set(center.x,center.y,center.z);camera.position.set(center.x+size.y*1.7,center.y+size.y*.7,center.z+size.y*2.1);camera.lookAt(controls.target);controls.update();
 status.textContent=`Loaded assets/obsidianti/Obsidianti.glb; clips: ${g.animations.map(a=>a.name).join(', ')}. Quarantined Idle awaits rig playback review.`;select('LionheartIdle_UNREVIEWED');
},undefined,e=>{status.textContent='VIEWER BLOCKED: '+String(e);});
function select(name){if(!mixer)return;for(const a of Object.values(actions))a.stop();mixer.stopAllAction();current=actions[name]||null;if(current){current.reset().play();current.setLoop(THREE.LoopRepeat,Infinity);current.paused=false;}playing=true;status.textContent=`Active: ${name||'Bind'} • visual review pending • no clip promoted.`}
document.querySelector('#idle').onclick=()=>select('LionheartIdle_UNREVIEWED');document.querySelector('#walk').onclick=()=>select('Walking');document.querySelector('#run').onclick=()=>select('Running');document.querySelector('#rest').onclick=()=>select(null);document.querySelector('#pause').onclick=()=>{if(current){current.paused=!current.paused;playing=!current.paused;}};
function frame(){requestAnimationFrame(frame);if(mixer&&playing)mixer.update(Math.min(clock.getDelta(),.06));else clock.getDelta();controls.update();renderer.render(scene,camera)}frame();
</script></body></html>
