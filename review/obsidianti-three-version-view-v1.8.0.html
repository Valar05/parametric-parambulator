<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obsidianti | Three version review</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#111822;color:#f2f5fa;font:14px system-ui;margin:0;min-height:100dvh;display:flex;flex-direction:column}header{padding:9px 12px;background:#202b3a}h1{font-size:17px;margin:0 0 4px}#status,#ids{font-size:11px;color:#ced8e6;overflow-wrap:anywhere}#stage{flex:1;min-height:260px;display:grid;grid-template-columns:1fr 1fr}#stage.solo{grid-template-columns:1fr}section{position:relative;min-height:240px;overflow:hidden}section canvas{width:100%;height:100%;display:block;touch-action:none}section strong{position:absolute;top:7px;left:7px;background:#182332e3;padding:5px 8px;border-radius:7px;font-size:12px;pointer-events:none}#sourcePane{border-right:1px solid #5f7185}#stage.solo #sourcePane{display:none}footer{padding:9px 12px;background:#202b3a;display:flex;flex-direction:column;gap:7px}label{font-size:13px}select,button,input{font:inherit;accent-color:#e3b978;color:#fff;background:#34475b;border:1px solid #8498b0;border-radius:7px;padding:7px;min-height:38px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffdb8a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar label{display:flex;align-items:center;gap:5px}#scrub{width:100%;padding:0}#timeline{font-variant-numeric:tabular-nums;font-size:12px;color:#e0e7f1}.caption{font-size:11px;color:#b9c7d8}.hidden{display:none!important}.error{color:#ffb3a0!important}#targetPane strong{right:7px;left:auto}@media(max-width:580px){select{max-width:48vw}#stage{min-height:47vh}.toolbar{gap:5px}button{min-height:36px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body>
<header><h1>Obsidianti animation laboratory · v1.8.0</h1><div id="status" role="status" aria-live="polite">Checking immutable model identities…</div><div id="ids"></div></header>
<div id="stage"><section id="sourcePane"><strong>ORIGINAL LIONHEART</strong><canvas id="sourceCanvas"></canvas></section><section id="targetPane"><strong id="targetTitle">OBSIDIANTI</strong><canvas id="targetCanvas"></canvas></section></div>
<footer>
<div class="toolbar"><label><input type="checkbox" id="showSource" checked> Show Lionheart</label><label for="version">Obsidianti version</label><select id="version"><option value="v156">v1.5.6 · improved Heavy1</option><option value="v170">v1.7.0 · multi-action preview</option><option value="canonical">Canonical · rejected baseline</option></select></div>
<div class="toolbar" id="sourceControls"><label for="sourceClip">Lionheart animation</label><select id="sourceClip"></select></div>
<div class="toolbar"><label for="targetClip">Obsidianti animation</label><select id="targetClip"></select><button id="back" aria-label="Previous half frame">◀ ½f</button><button id="play">Play</button><button id="next" aria-label="Next half frame">½f ▶</button><button id="restart">Restart</button></div>
<input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Synchronized position within selected animations"><div id="timeline">0.0%</div>
<div class="toolbar"><label for="speed">Speed</label><select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select><label><input type="checkbox" id="loop" checked> Loop</label><button id="reframe">Reframe camera</button></div>
<div class="caption">Both animation menus are independent. Lionheart can be hidden. Cameras and zoom persist across animation and version changes. Reference files are immutable; review only.</div>
</footer>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {clone as cloneSkeleton} from 'three/addons/utils/SkeletonUtils.js';
const el=id=>document.getElementById(id), status=el('status'),run=new URLSearchParams(location.search).get('run')||'';
function fail(e){status.classList.add('error');status.textContent='ERROR: '+String(e?.message||e);console.error(e)}
const loader=new GLTFLoader();
async function fetchJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u+' HTTP '+r.status);return r.json()}
async function checkedGLB(rec){const r=await fetch(rec.file+'?sha='+rec.sha256,{cache:'no-store'});if(!r.ok)throw Error(rec.file+' HTTP '+r.status);const b=await r.arrayBuffer();const s=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(v=>v.toString(16).padStart(2,'0')).join('');if(s!==rec.sha256)throw Error('GLB digest mismatch '+rec.file);return new Promise((ok,no)=>loader.parse(b,location.href,ok,no))}
function panel(canvasID){const canvas=el(canvasID),scene=new THREE.Scene();scene.background=new THREE.Color('#172231');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.outputColorSpace=THREE.SRGBColorSpace;const camera=new THREE.PerspectiveCamera(42,1,.01,1000);scene.add(new THREE.HemisphereLight(0xffffff,0x77839d,2));let light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(2,5,4);scene.add(light);let grid=new THREE.GridHelper(8,16,0x587187,0x36475a);scene.add(grid);let controls=new OrbitControls(camera,canvas);controls.enableDamping=true;return {scene,renderer,camera,controls,grid,root:null,mixer:null,clip:null,framed:false,modelScale:1,anchor:new THREE.Vector3()}}
const P={source:panel('sourceCanvas'),target:panel('targetCanvas')};
// Compute a stable character size from skeleton joint landmarks in the rest/first pose,
// not per-animation skinned bounds (which may include a long lance).
function rigBounds(root){root.updateMatrixWorld(true);let joints=[];root.traverse(o=>{if(o.isBone&&/hips|head|neck|foot|toebase|upleg|spine/i.test(o.name)){let v=new THREE.Vector3();o.getWorldPosition(v);joints.push({name:o.name,point:v})}});
 const head=joints.filter(v=>/head|neck/i.test(v.name)),lower=joints.filter(v=>/foot|toebase/i.test(v.name));
 if(head.length&&lower.length){const h=Math.max(...head.map(x=>x.point.y)),f=Math.min(...lower.map(x=>x.point.y));if(h>f+.2){const hips=joints.find(x=>/hips/i.test(x.name));return {height:h-f,origin:new THREE.Vector3(hips?.point.x||0,f,hips?.point.z||0)}}}
 const b=new THREE.Box3().setFromObject(root),size=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());return {height:Math.max(.5,size.y),origin:new THREE.Vector3(center.x,b.min.y,center.z)}}
function mount(p,g,clipName){const clip=g.animations.find(a=>a.name===clipName);if(!clip)throw Error('Missing exact action '+clipName);if(p.root){p.scene.remove(p.root);p.mixer?.stopAllAction()}
 const root=cloneSkeleton(g.scene),m=rigBounds(root),scale=1.65/m.height;p.modelScale=scale;p.anchor.copy(m.origin);root.scale.setScalar(scale);root.position.copy(m.origin).multiplyScalar(-scale);p.root=root;p.scene.add(root);
 p.clip=clip;p.mixer=new THREE.AnimationMixer(root);p.mixer.clipAction(clip).play();if(!p.framed)reframe(p);}
function reframe(p){p.controls.target.set(0,.83,0);p.camera.position.set(2.4,1.65,3.8);p.camera.zoom=1;p.camera.updateProjectionMatrix();p.controls.update();p.framed=true}
let manifest,donor,targets={},loadedVersion='',playing=false,time=0,duration=1,last=performance.now();
const versions={canonical:'Canonical · rejected baseline',v156:'v1.5.6 · Heavy1 improved',v170:'v1.7.0 · multi-action unapproved'};
function populate(select,names){const prev=select.value;select.replaceChildren();for(const name of names){let o=document.createElement('option');o.value=name;o.textContent=name;select.append(o)}if(names.includes(prev))select.value=prev;else select.value=names.includes('Lionheart_Heavy1')?'Lionheart_Heavy1':names[0]||''}
function update(){const phase=duration?Math.max(0,Math.min(1,time/duration)):0;for(const p of Object.values(P)){if(p.clip&&p.mixer)p.mixer.setTime(phase*p.clip.duration)}el('scrub').value=phase;el('timeline').textContent=(phase*100).toFixed(1)+'% · Lionheart '+(phase*(P.source.clip?.duration||0)).toFixed(3)+'s · Obsidianti '+(phase*(P.target.clip?.duration||0)).toFixed(3)+'s';}
function selectAction(){const sourceName=el('sourceClip').value,targetName=el('targetClip').value,version=el('version').value;if(!targets[version])return;
 mount(P.source,donor,sourceName);mount(P.target,targets[version],targetName);duration=Math.max(P.source.clip.duration,P.target.clip.duration);if(!(duration>0))throw Error('Zero-duration animation');time=0;playing=false;el('play').textContent='Play';update();status.classList.remove('error');status.textContent='Lionheart: '+sourceName+' | Obsidianti '+version+': '+targetName+' | both GLBs SHA verified';el('targetTitle').textContent='OBSIDIANTI · '+versions[version];}
let changeSeq=0;
async function switchVersion(){const n=++changeSeq,version=el('version').value;status.textContent='Loading '+versions[version]+'…';el('version').disabled=true;try{if(!targets[version])targets[version]=await checkedGLB(manifest.versions[version]);if(n!==changeSeq)return;loadedVersion=version;populate(el('targetClip'),targets[version].animations.map(a=>a.name));selectAction();el('ids').textContent='RUN '+run+' | Lionheart '+manifest.lionheart.sha256.slice(0,12)+' | Obsidianti '+manifest.versions[version].sha256.slice(0,12)}catch(e){fail(e)}finally{if(n===changeSeq)el('version').disabled=false}}
function setSourceVisible(){const visible=el('showSource').checked;el('stage').classList.toggle('solo',!visible);el('sourceControls').classList.toggle('hidden',!visible);el('sourcePane').setAttribute('aria-hidden',String(!visible));}
function render(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){time+=dt*Number(el('speed').value);if(time>=duration){if(el('loop').checked)time%=duration;else{time=duration;playing=false;el('play').textContent='Play'}}update()}
 for(const [name,p] of Object.entries(P)){if(name==='source'&&!el('showSource').checked)continue;const w=p.renderer.domElement.clientWidth,h=p.renderer.domElement.clientHeight;if(w<1||h<1)continue;p.renderer.setSize(w,h,false);p.camera.aspect=w/h;p.camera.updateProjectionMatrix();p.controls.update();p.renderer.render(p.scene,p.camera)}requestAnimationFrame(render)}
el('showSource').addEventListener('change',setSourceVisible);el('version').addEventListener('change',switchVersion);el('sourceClip').addEventListener('change',()=>{try{selectAction()}catch(e){fail(e)}});el('targetClip').addEventListener('change',()=>{try{selectAction()}catch(e){fail(e)}});el('play').addEventListener('click',()=>{playing=!playing;el('play').textContent=playing?'Pause':'Play'});el('restart').addEventListener('click',()=>{time=0;playing=false;el('play').textContent='Play';update()});for(const [id,dir] of [['back',-1],['next',1]])el(id).addEventListener('click',()=>{time=Math.min(duration,Math.max(0,time+dir*duration/60));playing=false;el('play').textContent='Play';update()});el('scrub').addEventListener('input',()=>{time=Number(el('scrub').value)*duration;playing=false;el('play').textContent='Play';update()});el('reframe').addEventListener('click',()=>{for(const p of Object.values(P))reframe(p)});
try{manifest=await fetchJSON('manifest.json?run='+encodeURIComponent(run));if(manifest.run!==run)throw Error('Stale manifest/run identity');donor=await checkedGLB(manifest.lionheart);populate(el('sourceClip'),donor.animations.map(a=>a.name));el('sourceClip').value=[...el('sourceClip').options].some(x=>x.value==='Heavy1')?'Heavy1':el('sourceClip').value;await switchVersion();setSourceVisible();requestAnimationFrame(render)}catch(e){fail(e)}
</script></body></html>
