<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidianti GLB-first retarget review</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#111826;color:#e8edf5;font:14px system-ui;margin:0;display:flex;flex-direction:column;height:100dvh}header{padding:9px 12px;background:#243249}header strong{display:block;font-size:16px}#identity{font-size:11px;overflow-wrap:anywhere;color:#bdd5ee}#status{font-size:12px;color:#ffda81}#stage{flex:1;min-height:190px}footer{background:#243249;display:flex;flex-wrap:wrap;gap:7px;padding:8px;align-items:center}button,select,input{font:inherit;background:#344563;border:1px solid #7287a1;color:white;border-radius:5px;padding:5px}input[type=range]{width:100%;flex:1;min-width:140px}.label{font-size:12px}small{color:#b8c9e2}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script></head><body><header><strong>Obsidianti | GLB-first vs historical FK</strong><div id="identity">Loading versioned build identity...</div><div id="status" role="status">Loading exact candidate</div></header><main id="stage"></main><footer><label>Attack <select id="attack"></select></label><label>Version <select id="version"><option value="new">New GLB-first</option><option value="old">Previous Ares-scaled FK</option></select></label><button id="play">Pause</button><button id="reset">Replay</button><label>Speed <select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label class="label">Time <input id="scrub" type="range" min="0" max="1" step=".001" value="0"></label><small id="time">0.00s</small><small>Swipe to orbit • pinch zoom. New version is unapproved; original actions remain available</small></footer><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
let manifest=null,mixer=null,actions=new Map(),current=null,paused=false,last=performance.now(),duration=1;const el=id=>document.getElementById(id),stage=el('stage');const scene=new THREE.Scene();scene.background=new THREE.Color(0x111826);scene.add(new THREE.HemisphereLight(0xffffff,0x7088a1,2.0));const d=new THREE.DirectionalLight(0xffffff,2.8);d.position.set(2,5,3);scene.add(d);scene.add(new THREE.GridHelper(6,30,0x536784,0x384456));const camera=new THREE.PerspectiveCamera(39,1,.02,150),render=new THREE.WebGLRenderer({antialias:true});render.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(render.domElement);const orbit=new OrbitControls(camera,render.domElement);orbit.enableDamping=true;new ResizeObserver(()=>{render.setSize(Math.max(1,stage.clientWidth),Math.max(1,stage.clientHeight));camera.aspect=stage.clientWidth/Math.max(1,stage.clientHeight);camera.updateProjectionMatrix()}).observe(stage);const names=['Cast','Heavy1','Heavy2','Heavy3','Kick','Light1','Light2','Light3','SpringAttack','Stomp'];for(const n of names){const o=document.createElement('option');o.value=n;o.textContent=n;el('attack').append(o)}el('attack').value='Heavy1';
function choose(){if(!mixer)return;for(const a of actions.values())a.stop();const name=(el('version').value==='new'?'LionheartGLBBake_':'Lionheart_')+el('attack').value;current=actions.get(name);if(!current){el('status').textContent='MISSING CLIP '+name;return}current.reset().setLoop(THREE.LoopRepeat,Infinity).play();paused=false;current.paused=false;el('play').textContent='Pause';duration=current.getClip().duration;el('scrub').max=String(duration);el('status').textContent='PLAYING '+name+' • verified candidate, visual review pending'}el('attack').onchange=choose;el('version').onchange=choose;el('play').onclick=()=>{paused=!paused;if(current)current.paused=paused;el('play').textContent=paused?'Play':'Pause'};el('reset').onclick=choose;el('speed').onchange=()=>{if(mixer)mixer.timeScale=Number(el('speed').value)};let seeking=false;el('scrub').oninput=()=>{if(!current)return;seeking=true;current.time=Number(el('scrub').value);mixer.update(0);el('time').textContent=Number(el('scrub').value).toFixed(2)+'s'};el('scrub').onchange=()=>{seeking=false};
async function main(){const mr=await fetch('./manifest.json?stamp='+Date.now(),{cache:'no-store'});if(!mr.ok)throw Error('MANIFEST_HTTP_'+mr.status);manifest=await mr.json();el('identity').textContent=`Campaign ${manifest.campaign} | entry ${manifest.launcherSHA256} | GLB ${manifest.modelSHA256} | Git ${manifest.sourceHead}`;const resp=await fetch('./candidate.glb?sha='+manifest.modelSHA256,{cache:'no-store'});if(!resp.ok)throw Error('MODEL_HTTP_'+resp.status);const bytes=await resp.arrayBuffer();const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(v=>v.toString(16).padStart(2,'0')).join('');if(digest!==manifest.modelSHA256)throw Error('MODEL_SHA256_MISMATCH');const gltf=await new Promise((r,j)=>new GLTFLoader().parse(bytes,'',r,j));scene.add(gltf.scene);mixer=new THREE.AnimationMixer(gltf.scene);for(const clip of gltf.animations)actions.set(clip.name,mixer.clipAction(clip));const bounds=new THREE.Box3().setFromObject(gltf.scene),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),span=Math.max(size.length(),1);orbit.target.copy(center);camera.position.set(center.x+span*.65,center.y+span*.35,center.z+span*.9);orbit.update();el('status').textContent=`VERIFIED ${gltf.animations.length} clips`;choose()}
main().catch(e=>{el('status').textContent='REVIEW VIEWER FAILED: '+String(e);console.error(e)});function frame(t){requestAnimationFrame(frame);let dt=Math.min(.08,Math.max(0,(t-last)/1000));last=t;if(mixer)mixer.update(dt);if(current&&!seeking){el('scrub').value=String(current.time%duration);el('time').textContent=(current.time%duration).toFixed(2)+'s'}orbit.update();render.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
